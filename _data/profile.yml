bio: |
  I am a Ph.D. student at <a href="https://sites.google.com/view/arvrlab/home">ECL in Korea</a>,
  <a href="https://www.jnu.ac.kr/">Chonnam National University</a>, advised by
  Prof. <a href="https://scholar.google.com/citations?user=epOZdMsAAAAJ&hl=ko&oi=ao">Seungwon Kim</a>.

  My research interests lie in AR/VR and HCI, especially in human-agent interaction.

